name: مخزون سريع

on:
  schedule:
    - cron: '*/10 * * * *'     # كل ١٠ دقائق — المقاسات تنفد أسرع من المزامنة الكاملة
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false
  cancel-in-progress: true      # لا معنى لتشغيلين متراكمين على نفس البيانات

jobs:
  stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: توليد المخزون
        run: CATALOG_IN=catalog.json STOCK_OUT=stock.json node scripts/sync-stock.mjs

      - name: أودِع وادفع (مع إعادة عند التسابق)
        run: |
          git add stock.json
          if git diff --cached --quiet -- stock.json; then echo "لا تغيير"; exit 0; fi
          CHANGED=$(git diff --cached -- stock.json | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v generatedAt || true)
          if [ -z "$CHANGED" ] && git cat-file -e HEAD:stock.json 2>/dev/null; then
            echo "الطابع الزمني فقط — تجاهل"; git reset -q -- stock.json; git checkout -- stock.json; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "مخزون — $(date -u '+%H:%M UTC')"
          # المساران يدفعان إلى main — بلا إعادة يفشل أحدهما كلّما تزامنا
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "تسابق على الدفع — محاولة $i"
            git pull --rebase -X ours origin main || git rebase --abort || true
            sleep $((i * 3))
          done
          echo "تعذّر الدفع بعد ٥ محاولات"; exit 1

      - name: تأكّد أن المنشور هو ما وُلّد
        run: |
          # مهمّة خضراء لا تعني ملفاً منشوراً — رُصد حيّاً أن Pages
          # ما زال يخدم القديم (أو 404) بعد نجاح المهمّة.
          LOCAL=$(node -e "console.log(require('./stock.json').generatedAt || require('./stock.json').at)")
          for i in $(seq 1 20); do
            REMOTE=$(curl -sf --max-time 15 "https://riyadsmart-hub.github.io/risport-catalog/stock.json" | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                try{const j=JSON.parse(s);console.log(j.generatedAt||j.at||'')}catch{console.log('')}})" || echo "")
            if [ "$REMOTE" = "$LOCAL" ]; then echo "✓ منشور ومطابق ($LOCAL)"; exit 0; fi
            sleep 15
          done
          echo "⚠️ لم يظهر المنشور بعد ٥ دقائق — المولّد نجح لكن النشر لم يصل"
          exit 1

      - name: نبّه عند الفشل أو الإلغاء
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ توقّف مسار المخزون السريع';
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'sync-failure',
            });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo, title, labels: ['sync-failure'],
              body: [
                'الحالة: ${{ job.status }}',
                '',
                'التشغيل: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
                '',
                'التطبيق يبقى على آخر مخزون ناجح — وكلّما طال العطل زاد احتمال شراء مقاس نافد.',
              ].join('\n'),
            });
