name: مزامنة الكتالوج

on:
  schedule:
    - cron: '17 * * * *'      # كل ساعة (دقيقة ١٧ لتجنّب ذروة الجدولة)
  workflow_dispatch:           # تشغيل يدوي من واجهة GitHub

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: توليد الكتالوج
        run: CATALOG_OUT=catalog.json node scripts/sync-catalog.mjs

      - name: تحقّق من سلامة الناتج
        run: |
          node -e '
            const c = require("./catalog.json");
            if (!Array.isArray(c.products) || c.products.length < 5)
              throw new Error("كتالوج فارغ أو ناقص — لا تُودِع");
            const noImg = c.products.filter(p => !p.images?.length).length;
            if (noImg > c.products.length / 2)
              throw new Error("أكثر من نصف المنتجات بلا صور — لا تُودِع");
            console.log(`✓ ${c.products.length} منتجاً · ${noImg} بلا صور`);
          '

      - name: أودِع إن تغيّر شيء
        run: |
          git add catalog.json
          # الملف الجديد لا يظهر في git diff — نقارن المُدرَج،
          # ونتجاهل تغيّر الطابع الزمني وحده حتى لا نُودِع بلا داعٍ.
          if git diff --cached --quiet -- catalog.json; then
            echo "لا تغيير"; exit 0
          fi
          CHANGED=$(git diff --cached -- catalog.json | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v generatedAt || true)
          if [ -z "$CHANGED" ] && git cat-file -e HEAD:catalog.json 2>/dev/null; then
            echo "الطابع الزمني فقط — تجاهل"; git reset -q -- catalog.json; git checkout -- catalog.json; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "مزامنة الكتالوج — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: نبّه عند الفشل
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ توقّفت مزامنة الكتالوج';
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'sync-failure',
            });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo, title, labels: ['sync-failure'],
              body: `فشلت المزامنة الكاملة.\n\nالتشغيل: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nالتطبيق يبقى على آخر كتالوج ناجح — الأسعار الجديدة لن تصل حتى يُصلَح.`,
            });
